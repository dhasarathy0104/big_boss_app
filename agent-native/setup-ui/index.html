<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Connect Desklog Agent</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0b0d12;
    color: #eef0f4;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, #3987e5, #9085e9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
  }
  .brand-name { font-weight: 700; font-size: 16px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p.sub { color: #8b93a3; font-size: 13px; line-height: 1.5; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: #8b93a3; margin-bottom: 5px; margin-top: 14px; }
  input {
    width: 100%;
    font-size: 13px;
    background: #171a21;
    color: #eef0f4;
    border: 1px solid #262b36;
    border-radius: 6px;
    padding: 9px 11px;
  }
  input:focus { outline: none; border-color: #3987e5; }
  button {
    width: 100%;
    margin-top: 20px;
    font-size: 13px;
    font-weight: 600;
    background: #3987e5;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .status { margin-top: 14px; font-size: 12.5px; min-height: 18px; }
  .status.error { color: #e05a5a; }
  .status.ok { color: #17b86f; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">D</div>
      <div class="brand-name">Desklog</div>
    </div>
    <h1>Connect this computer</h1>
    <p class="sub">Paste the invite link your manager sent you, and enter your name.</p>

    <label for="link">Invite link</label>
    <input id="link" placeholder="http://.../join/abc123" />

    <label for="name">Your name</label>
    <input id="name" placeholder="Jane Doe" />

    <button id="submit">Connect</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const linkInput = document.getElementById('link');
    const nameInput = document.getElementById('name');
    const submitBtn = document.getElementById('submit');
    const statusEl = document.getElementById('status');

    function parseInvite(raw) {
      try {
        const url = new URL(raw.trim());
        const match = url.pathname.match(/\/join\/([^/]+)/);
        if (!match) return null;
        return { token: match[1], backendUrl: url.origin };
      } catch {
        return null;
      }
    }

    submitBtn.addEventListener('click', async () => {
      statusEl.textContent = '';
      statusEl.className = 'status';

      const parsed = parseInvite(linkInput.value);
      const name = nameInput.value.trim();

      if (!parsed) {
        statusEl.textContent = 'That doesn\'t look like a valid invite link.';
        statusEl.className = 'status error';
        return;
      }
      if (!name) {
        statusEl.textContent = 'Enter your name.';
        statusEl.className = 'status error';
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = 'Connecting…';

      try {
        const managerName = await invoke('submit_setup', {
          name,
          inviteToken: parsed.token,
          backendUrl: parsed.backendUrl,
        });
        statusEl.textContent = `Connected — joined ${managerName}'s team. You can close this window.`;
        statusEl.className = 'status ok';
      } catch (err) {
        statusEl.textContent = String(err);
        statusEl.className = 'status error';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
