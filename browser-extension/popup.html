<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        padding: 16px;
        background: #171a21;
        color: #e6e8ec;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .status { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 12px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; }
      .dot.on { background: #35c07a; }
      .dot.off { background: #e0685f; }
      .note { font-size: 11px; color: #8b93a3; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Desklog Tracker</h1>
    <div class="status">
      <span id="dot" class="dot off"></span>
      <span id="statusText">Checking…</span>
    </div>
    <div class="note">
      Sends only the current tab's domain (e.g. "github.com", never the full page or history)
      to the tracking agent running on this computer — nothing leaves this machine directly.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
